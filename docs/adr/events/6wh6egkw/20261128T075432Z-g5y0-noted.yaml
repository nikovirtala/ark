data:
  text: "A recorded cause is the writer's claim, not a checked fact: verify checks that an address is well-formed and, for a ledger address, that it exists, not that it names the real cause. A measure built on agent-written causes is only as good as those agents, so no unattended reader (dispatcher, breaker, promote gate) decides from causes, and an agent step that follows causes carries addresses, never the text it finds there (docs/05-factory-v1.md, One graph of the line). Raised in the 27 November 2026 review (docs/reviews/2026-11-27-factory-v1.md)."
