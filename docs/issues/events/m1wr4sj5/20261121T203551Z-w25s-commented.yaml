  text: "The deployment member (packages/deployment, issue acc99x0k) is a fourth package to move with the others: it requires Node 24 today like ledger, adr and issues. It relies on Node's type stripping (unflagged since 22.18) to run TypeScript deployment tasks, so 22.18 is its floor on Node 22."
