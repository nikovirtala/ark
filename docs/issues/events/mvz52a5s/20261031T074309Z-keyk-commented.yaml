    ## What adr and issues implement the same way

    I read `packages/adr/src`, `packages/issues/src` and `packages/ledger/src` at 1ac4c4f and compared every pair of files the two tools both have. The relation layer, which roadmap step 5 names as the most likely lift, turns out to share the least code. The two tools match almost line for line in the write path, the index command and its check, the log read and source reads, the config keys both tools read, init with the git hook steps, and the `for` path lookup. Apart from tool names and nouns, most of their differences are domain; the accidental ones are listed under each candidate and become parameters.

    Summary, in the order to do the lifts:

    | # | Candidate | Recommendation | Depends on | Size (commits) | Risk |
    | --- | --- | --- | --- | --- | --- |
    | 1 | Source helpers (index numbering, source-name pattern) | lift now: ?12 | none | 2 | low |
    | 2 | Config keys both tools read | lift now | none | 2 | low |
    | 3 | Index command and freshness check | lift now | none | 3–4 | medium |
    | 4 | Log read and source reads | lift now | ?12, ?35, ?36 | 4 | medium |
    | 5 | Write path: plan helpers, apply, write driver | lift now | 3 | 6–8 | high |
    | 6 | Init, git hook steps, CLI editor | lift now | 2, 3, init index bug | 4 | medium |
    | 7 | `for` path lookup and template listing | lift now | none | 2–3 | low |
    | 8 | Relations: qualified-reference checks | lift later | ?12 | 3 | low |
    | 8 | Relations: supersession chain and issue graph | leave in the tools | | | |
    | 9 | Agent surfaces: search ranking | leave in the tools | | | |
    | 9 | Agent surfaces: MCP schema and argument helpers | lift later | ?12 | 1–2 | low |
    | 9 | Agent surfaces: server setup, policy, prompts, skill text, text renderers | leave in the tools | | | |
    | 10 | Test support (index-invariant suites, CLI fixtures) | leave in the tools | | | |

    Candidates 1, 2, 3 and 7 don't depend on each other. Candidate 2 and ?12 both edit `packages/issues/src/sources.ts` and `packages/ledger/src/sources/config.ts`, but in different functions. Every lift adds exports to `packages/ledger/src/index.ts` and `packages/ledger/README.md`, and those conflicts are additive. More pairs share a file: ?12 and candidates 2 and 7 all touch `packages/ledger/src/scope/anchors.ts`; ?12 and candidate 3 both add exports to `packages/ledger/src/log-index/index.ts`; candidates 4 and 8a edit different functions of `adr/src/sources.ts`, `issues/src/sources.ts` and `issues/src/log.ts`; and candidates 8a and 5 both edit `packages/adr/src/write.ts` (8a changes `planLink`). Candidates 5 and 6 both need `stagedEventRefs`; whichever lands first moves it to ledger and the other uses it, so neither waits for the other. In each pair, whichever lands second rebases.

    Reading the code turned up one bug next to candidate 6: a committing `issues init` can commit an index that lists issues the commit doesn't contain (details under candidate 6). It is a fix, not a lift, so it gets its own issue that can start now, and candidate 6 waits for it.

    How the parallel fixes affect this: ?35 changes how both tools read a source that isn't fetched (`readSourceDecisions`, `readSourceIssues`), and ?36 changes adr's `numberingNote`. Both sit inside candidate 4, and after them the two tools behave the same, so candidate 4 depends on them. ?12 also overlaps ?36, which concerns the `index` reason that `indexNumbering` sets for a source read, and ?35, which edits `readSourceIssues` next to the inline copy. Whichever lands second rebases. If ?36 changes what `indexNumbering` returns, ?12 moves the changed version. ?12 gets no dependency on them, so it can start now. ?2 changes `packages/ledger/src/sources` and `git`, the same area where ?12, 2, 4 and 8 add code. It doesn't change what is duplicated, but those lifts must rebase onto it. ?34 only touches the test environment.

    A rule for every lift: tool names, nouns, rule ids, document formats (`adr-*/v1`, `issues-*/v1`) and message wording are parameters, and stay byte for byte as they are now. A lift is done when both tools' existing tests pass without any change to what they expect. Domain rules stay in the kinds: state machines, invariants, and what supersession or a dependency means.

    Where the lifted code goes is set by `packages/ledger/src/layers.test.ts`: a file may import only from its own layer or a lower one (templates 4, kind 6, fold 7, sources 9, scope 10, log-index 11, hooks 12, surfaces 13, cli 14, mcp 15), and type-only imports count. Anything that takes a `ToolLog`, commits through `commitWithRecovery`, or uses `EventRef` or `resolveAttribution` goes in `surfaces/`. The placements below follow that rule.

    ---

    ### 1. Source helpers: index numbering and the source-name pattern (?12)

    - **Files.** `indexNumbering`: `packages/adr/src/sources.ts:38`, `packages/issues/src/sources.ts:173`, and inlined in `readSourceIssues` (`packages/issues/src/log.ts:262-271`). Source-name pattern `/^[a-z][a-z0-9-]{0,31}$/`: `packages/ledger/src/sources/config.ts:29`, `packages/ledger/src/cli/sources-command.ts:28`, `packages/adr/src/sources.ts:107`, `packages/issues/src/log.ts:217`. ?12 doesn't list six more copies: `packages/adr/src/write.ts:1114` (`planLink`), the MCP `SOURCE` schemas in `packages/adr/src/mcp/tools.ts:153` and `packages/issues/src/mcp/tools.ts:46`, the source part of issues' reference schema `ISSUE_REF` (`packages/issues/src/kind/schemas.ts:39`), the source part of `QUALIFIED_ID` in `packages/ledger/src/sources/qualified-id.ts:10`, and the source part of the anchor pattern in `packages/ledger/src/scope/anchors.ts:151`. `KEYWORD` (`packages/ledger/src/scope/anchors.ts:21`) uses the same regex, but for the anchor keyword, a different rule, so it stays out of ?12.
    - **Same.** Every copy is identical.
    - **Differs.** adr's reference schema `REF` (`packages/adr/src/kind/schemas.ts:23`) allows a source name of any length (`[a-z][a-z0-9-]*:`). issues' `ISSUE_REF` caps it at 32 characters. The difference is accidental, but `REF` is part of the `decision/v1` schema, so tightening it could invalidate stored events. It stays as it is, outside ?12.
    - **Proposed API.** `indexNumbering(byId)` next to `readIndexNumbers` in `log-index/render.ts`. From `sources/config.ts`: `SOURCE_NAME = "[a-z][a-z0-9-]{0,31}"`, an unanchored string, and `isSourceName(s)`. Callers anchor the string themselves: `` new RegExp(`^${SOURCE_NAME}$`) `` in the tools' `--source` checks and `planLink`, the capture group in `QUALIFIED_ID`, the `git grep -E` pattern in `anchors.ts`, `` `^${SOURCE_NAME}$` `` for the two MCP `SOURCE` schemas, and the group in `ISSUE_REF`, whose schema string stays byte for byte the same. `sources-command.ts` uses `isSourceName`. `scope/anchors.ts` (layer 10) and `sources/qualified-id.ts` (layer 9) may import from `sources/config.ts`. `sourceAt` in `scope/anchors.ts:50-55` scans the same rule character by character (`SOURCE_FIRST`, `SOURCE_CHAR`, `j - i < 32`) while it walks a line; it stays, with a comment pointing at `SOURCE_NAME`.
    - **Risk.** Low.
    - **Size.** 2 commits.
    - **Recommendation.** Lift now, as ?12, which becomes part of this issue. Its Done when gains a line for the ledger and schema copies, so closing ?12 requires them.

    ### 2. Config keys both tools read

    - **Files.** `parseAdrConfig` (`packages/adr/src/config.ts:79`), `parseIssuesConfig` (`packages/issues/src/config.ts:87`), and a third copy of the `[log] main_branch` and `[log] index` rules in `adrNumberingKeys` (`packages/issues/src/sources.ts:47`), which issues needs because it may import adr only through `@nikovirtala/adr/kind`. `isTable` is defined five times: in both tools' `config.ts`, in `issues/src/sources.ts`, and in ledger's `sources/config.ts` and `surfaces/tool-log.ts`.
    - **Same.** The `fail`, `table`, `bool` and `oneOf` readers, and the validation and messages of `[log] default_template`, `main_branch` and `index`, `[policy] auto_commit`, `[verify] fail_on`, `[scope] anchor_keyword` and `anchor_exclude`, `[hooks] scope_follow_renames` and `index`, and `[commit]` (through `readCommitTemplate`).
    - **Differs.** Domain: the defaults (`nygard` or `task`, `docs(adr)` or `docs(issues)`), adr's `accept_requires_human`, `mcp_can_decide` and `[verify] governed_by_inactive`, and issues' `[labels]`, `close_requires_human` and `mcp_can_close`. Accidental: the order of the `[log] index` values in its message. adr (`packages/adr/src/config.ts:147`) and issues' `adrNumberingKeys` say `log.index must be "committed" or "none"`; issues (`packages/issues/src/config.ts:161`) says `"none" or "committed"`. Tests pin both wordings (`adr/src/config.test.ts:111`, `issues/src/config.test.ts:98-100`, `issues/src/sources.test.ts:73`). issues also checks `fail_on` by hand instead of with `oneOf`, with the same message.
      Also accidental: the two parsers check keys in different orders (adr: `default_template`, `main_branch`, `anchor_keyword`, `anchor_exclude`, then `index` and the rest; issues: `default_template`, `main_branch`, `index`, `fail_on`, `anchor_*`, `sources`, then the rest), so for a file with several bad keys each reports a different one first.
    - **Proposed API.** In `packages/ledger/src/surfaces/tool-log.ts`, next to `openToolLog`:
      ```ts
      toolConfigReader(config, file): { table, bool, oneOf, fail }
      parseNumberingKeys(log: Record<string, unknown>, fail, { indexValues }): { mainBranch: string | null; index: "none" | "committed" }
      parseSharedKeys(config, file, {
        tool,                // "adr" or "issues": the file-name fallback `${tool}.toml` in messages
        defaults: { defaultTemplate, anchorKeyword, commit: { vars, names, defaultSubject } },
        indexValues,
      }): SharedKeys         // calls parseNumberingKeys, then the rest
      // SharedKeys: { defaultTemplate, mainBranch, index, autoCommit, failOn, anchorKeyword,
      //   anchorExclude, scopeFollowRenames, hookIndex, commitSubject }
      ```
      `commit` passes each tool's `COMMIT_VARS`, `COMMIT_NAMES` and default subject (`docs(adr)` or `docs(issues)`) to `readCommitTemplate`. `indexValues` keeps the message order as a parameter: adr and `adrNumberingKeys` pass `["committed", "none"]`, issues passes `["none", "committed"]`, so no test changes. Each tool spreads the shared keys into its own config type and reads its own keys with the same reader. issues' `adrNumberingKeys` calls only `parseNumberingKeys`, so issues still validates only `[log]` being a table, `main_branch` and `index` in an `adr.toml`, and never refuses one over keys it doesn't read. Ledger keeps one `isTable`, in `sources/config.ts`, which `surfaces/tool-log.ts` imports. The shared parser imports from `sources/`, `scope/` (`parseGlob` for `anchor_exclude`) and `surfaces/`, all at or below layer 13. For `[scope] anchor_keyword` it uses `KEYWORD` from `packages/ledger/src/scope/anchors.ts:21`, exported for it (layer 10), instead of adding a copy; the message keeps `KEYWORD.source`, so its text doesn't change. Ledger's other two copies stay out of this lift: `kind/define.ts:10` is in layer 6, below `scope/`, so it can't import it, and `testing/anchors.ts:4` (layer 16) may import it but isn't config code, so this lift doesn't require it.
    - **Risk.** Low. The config tests in both packages pin every message. For a file with several bad keys, the first one reported may change, because the shared parser checks keys in one fixed order. No test asserts this order, and nothing else changes.
    - **Size.** 2 commits: the ledger module with tests, then both tools.
    - **Recommendation.** Lift now.

    ### 3. Index command and freshness check

    - **Files.** `packages/adr/src/log-index.ts` and `packages/issues/src/log-index.ts` (384 and 381 lines): `INDEX_RERUN`, `INDEX_BEFORE` and `INDEX_AFTER` (adr 58–72, issues 55–63), `render{Decision,Issue}Index` (133, 128), `unstagedIndexText` (172, 178), `unstagedLogFiles` (182, 185), `{decision,issue}IndexCheck` (201, 202), `run{Decision,Issue}Index` (256, 254), and the CLI wrappers in both tools' `cli/index-command.ts`. The copy helpers already moved to ledger in issues PR 2 (52a9a5a).
    - **Same.** The diff between the two files is tool names, nouns and the index spec. Both render the same way (`projectNumbering` with `MERGE_HEAD` and the committed-index fallback, then `renderIndex`), the staged-mode check rewrites `index/stale` to name unstaged files, and `run…Index` follows the same `--check`, no-commit and commit steps with the refresh after the commit.
    - **Differs.** Domain: `DECISION_INDEX` and `ISSUE_INDEX` (groups, columns, order), issues' 20 most recently closed, and issues rendering without sources so that the index depends only on the tree. Accidental: issues has `renderIssueIndexText` for its `issues://index` resource, while adr writes the same call inline in `packages/adr/src/mcp/resources.ts:21`.
    - **Proposed API.** In `packages/ledger/src/log-index/`, taking `git`, `layout` and `kind` but never a `ToolLog`: `renderLogIndex(git, { kind, layout, mainRef, tree, history, views, spec })`, where `views: (tree: TreeReader, numbering: Numbering) => Promise<readonly V[]>` is the tool's projection of a tree (async, because both tools build it with an awaited `readDecisionsFrom` or `readIssuesFrom`, `adr/src/log-index.ts:159`, `issues/src/log-index.ts:154-159`) and `spec: (root: string, views: readonly V[]) => IndexSpec<V>` its index spec (adr builds the `Map` that `DECISION_INDEX` takes inside `spec`); `unstagedLogFiles`; and `unstagedIndexText(path, files, noun)`. In a new `packages/ledger/src/surfaces/tool-index.ts`, because they take a `ToolLog` and commit through `commitWithRecovery` and `renderCommitMessage`: `logIndexCheck` and `runLogIndex`, and the three recovery hints as functions of tool and noun. `ToolLog` doesn't carry a tool's config (`runDecisionIndex` reads `log.adr.index`, `autoCommit` and `commitSubject`, `runIssueIndex` the same keys from `log.issues`), so the tool passes it:
      ```ts
      logIndexCheck(log: ToolLog, { tool, render }): Check
      runLogIndex(log: ToolLog, { tool, noun, format, index, autoCommit, commitSubject, title, action, render }, o: ToolWriteOptions & { check?: boolean }): Promise<IndexRun>
      ```
      `ToolWriteOptions` is a new ledger type with the fields both tools' `WriteOptions` share (`commit`, `message`, `notes`, `index`); adr's `index?: "refresh" | "skip"` is the wider one, and issues' `index?: "skip"` is assignable to it, so neither tool's exported `WriteOptions` changes.
      Here `format` is `adr-index/v1` or `issues-index/v1`, `index`, `autoCommit` and `commitSubject` come from the tool's parsed config, `title` and `action` are each tool's `INDEX_TITLE` and `INDEX_ACTION` (`commit-actions.ts`), and `render(git, { tree, history })` is the tool's `renderLogIndex` call with its spec bound. `tool` fills in `run adr index` or `run issues index` in the fix and the staged-mode message. `IndexRun` (`{ doc, refreshed }`) moves with it. In `packages/ledger/src/cli/`, an `indexCommand`, following the pattern of `sourcesCommand` and `verifyCommand`. The two `cli/index-command.ts` files are the same apart from names and issues' `--check` help string (`issues/src/cli/index-command.ts:31-34`), which adr lacks, so option help is a parameter of `indexCommand` and each tool's `--help` stays as it is.
    - **Risk.** Medium. This is the code under ADR-0010's invariant, which took review rounds 3 to 6 to get right. The suites that guard it must pass unchanged: adr's `src/cli/index-invariant.*.test.ts` (seven files), `src/log-index.test.ts` and `src/cli/index-command.test.ts`; issues' `src/cli/index-invariant.test.ts`, `src/write.index.*.test.ts`, `src/log-index.test.ts` and `src/cli/index-command.test.ts`.
    - **Size.** 3–4 commits: ledger module and tests, adr, issues, CLI command.
    - **Recommendation.** Lift now.

    ### 4. Log read and source reads

    - **Files.** adr: `readDecisionsFrom`, `numberDecisions`, `unavailableReason`, `ChangedSince` and `changedSince`, and `resolveDecision` (`packages/adr/src/log.ts:119, 98, 207, 242, 260, 217`); `readDecisionSources` and `readSourceDecisions` (`packages/adr/src/sources.ts:67, 115`); `NumberingJson`, `numberingJson` and the fold-order `events` of `showDecision` (`packages/adr/src/views.ts:13, 56, 117`). issues: `readIssuesFrom`, `numberIssues`, `readSourceIssues`, `unavailableReason` and `changedSince` (`packages/issues/src/log.ts:153, 132, 225, 282, 462`); `readDecisionLog` (a third copy of `numberLog` with the committed-index fallback), `foreignSubjects` and `readIssueSources` (`packages/issues/src/sources.ts:79, 186, 231`); `NumberingJson`, `numberingJson` and the `events` of `showIssue` (`packages/issues/src/views.ts:13, 121, 321`).
    - **Same.** The check pipeline (`loadFindings`, `transitions`, `invariantsCheck`, `relateCheck` over one `CheckContext`, then `sortFindings` with the kind's name). `numberLog` with the committed-index fallback, three times. `changedSince` with its `ChangedSince` type, and `unavailableReason`, word for word. The `--source` read once a source's config is found: an uncached source read as an empty `MemoryTree` with a "not fetched" note, otherwise `sourceLogRef` and index numbering. Folding a cached source into a map of status, display and title. `NumberingJson`, and the list and show filters of findings and events.
    - **Differs.** Domain: issues reads the local decision log and the cached sources on every read, because of `implements` and foreign blockers, while adr reads sources only with `--source`. Each tool's notes and resolve messages. Accidental: adr's `showDecision` is async and wraps `withGitOperation`, while `showIssue` is synchronous. The adr and issues `--source` reads word their numbering notes differently, which ?35 and ?36 are fixing. adr checks a source's kind before looking up its name (`packages/adr/src/sources.ts:121-124`, `source X has kind Y, which adr doesn't read`), and its unknown-source message also lists the sources it skips. issues looks up the name first and checks the kind after (`packages/issues/src/log.ts:230-241`, `source X is a decision log; --source reads issue logs`).
    - **Proposed API.** In `packages/ledger/src/surfaces/`: `readKindLog(kind, tree, { layout, numbering, checkOptions, projectOptions? })`, where `checkOptions` goes to `invariantsCheck` and `relateCheck` and `projectOptions` to `projectLog` (issues passes its full `IssueOptions` as `checkOptions` and `{ sources }` as `projectOptions` only when `sources !== null`, as `issues/src/log.ts:184-206` does; adr passes no `projectOptions`), which returns `{ snapshot, folded, projection, findings }`; `numberToolLog(git, { kind, layout, mainRef, index, ref })`; `changedSince(git, layout, rev, ref)` and `ChangedSince`; `unavailableReason`; `NumberingJson` and `numberingJson`; `eventsInFoldOrder(loaded)`. In a new `surfaces/source-read.ts`, for `--source` reads, only the part after a config is found:
      ```ts
      readSourceLog(git, config: SourceConfig, { kind, notFetched: string }):
        Promise<{ tree: TreeReader; layout: LogLayout; numbering: Numbering; commit: string | null; notes: string[] }>
      ```
      An uncached source gives an empty `MemoryTree`, the layout at `config.root ?? kind.def.defaultRoot`, the numbering both tools give an unfetched source once ?35 lands (today `NO_NUMBERING`, whose `no-main-ref` reason is what ?35 fixes), a `null` commit and `[notFetched]` as notes (`"<name> not fetched; run adr sources fetch"`). A cached one gives `sourceLogRef`'s tree and layout, the numbering of its committed index from ?12's `indexNumbering` as ?36 leaves it, its commit and no notes. The `--source` pattern check, the name lookup, the kind check and their messages stay in each tool, because their order and wording differ and a parameter for each would be larger than the code it replaces. Also in `source-read.ts`: `readSourceSubjects(fetched, kind, toForeign)`, which folds and numbers a cached source into a `ForeignSubject` map. These can't go in `sources/`, because they call `readIndexNumbers` and ?12's `indexNumbering` from `log-index/`, a higher layer. Only the type `ForeignSubject<S extends string = string>` (`{ status: S; display; title; effective: string | null }`) goes in `sources/`. adr's exported `ForeignDecision` and `AdrSource` stay as they are: a `ForeignSubject<DecisionStatus>` is assignable to `ForeignDecision`, so no public type of `@nikovirtala/adr/kind` changes.
    - **Risk.** Medium. The notes are user-visible, and ?35 and ?36 change them in the functions this lift moves.
    - **Size.** 4 commits.
    - **Recommendation.** Lift now, after ?12, ?35 and ?36.

    ### 5. Write path: plan helpers, apply, write driver

    - **Files.** adr: `packages/adr/src/write.ts` (2,410 lines). issues: `packages/issues/src/plan.ts`, `apply.ts` and `write.ts` (1,401, 456 and 731 lines).
      - Plan helpers: `checkText`, `checkReason`, `viewOf`, `refusal`, `findingKey`, `precheck`, `newEvent`, `filesOf`, `pairsOf`, `chooseTemplate`, `unmatchedGlobs` and the loop of `planFollowRenames` (adr `write.ts:249, 257, 266, 276, 349, 355, 297, 373, 382, 389, 1245, 1439`; issues `plan.ts:190, 199, 217, 225, 238, 245, 271, 304, 310, 497, 1013, 1288`).
      - Apply: `applyPlan`, `stagedEventRefs`, `unstagedIndexNote`, `WRITE_RERUN`, `AfterStage` and `AppliedPlan` (adr `write.ts:1558, 1832, 1537, 1528, 1503, 1513`; issues `apply.ts:169, 438, 141, 86, 47, 55`).
      - Driver: `write` with its one `EventExistsError` retry, `viewsAfter`, `checkCommitIdentity`, the work-tree check, the plan context, `editorStep` and `readIfPresent` (adr `write.ts:1971, 1870, 1888, 1980-1987, 1994-2000, 2101, 2085`; issues `write.ts:234, 204, 109, 115, 218, 335, 321`).
    - **Same.** `applyPlan` is the same algorithm step for step: the precheck of unstaged and untracked paths in the commit scope, the index render before anything is written (from the tree `git commit --only` builds), the rollback of replaced and new files and the index copy, staging, the editor step, the `--only` commit with exact trailers deduplicated by subject and type, `CommitFailedError` with recovery hints and notes, and the refresh after the commit (adr's ?5 port). The plan helpers and the driver are copies apart from the kind and the document format.
    - **Differs.**
      - Commit scope. adr works out the involved subjects' body, template and events directory while planning (`commitScope`, `write.ts:331`). issues widens the scope while applying, to every reached issue that isn't in `HEAD` yet (`commitScopeOf`, `apply.ts:101`). Domain: only issues links to uncommitted subjects. Where each tool computes its scope is accidental.
      - Step 4 index re-render after the editor. adr renders again only when the staged events changed. issues always renders again, because an edited `# ` heading changes an issue's title. Domain: adr titles live in event data.
      - Precheck policy. adr refuses any finding the write adds. issues refuses added errors and reports added warnings, and `unlink` reports them as notes. Domain: only issues has warning rules in its read checks.
      - The bytes of the commit tree after the editor step. issues builds `compose`'s tree and the step-4 re-render's tree from the work-tree bytes (`commitTree(extra, true)`, `packages/issues/src/apply.ts:226-236, 337, 356`), so an edited draft is what the index and the message see. adr builds both from the plan's bytes first, falling back to the work tree (`plan.files[p] ?? plan.replace?.[p]?.bytes ?? work.read(p)`, `packages/adr/src/write.ts:1626-1636, 1729, 1746`). Accidental, and kept as a parameter.
      - Accidental: `planEvent` (one event) against `planEvents` (several, tracking the status); `compose` synchronous in adr and async in issues; `afterStage()` against `afterStage(scope)`.
    - **Proposed API.** A generic `WritePlan` with the fields both tools share (`subject`, `files`, `replace`, `events`, `stage`, `commitScope`, `eventDirs`, `draft`, `commit`, `trailers`, `findings`, `notes`), which each tool extends with its own view fields. Plan helpers `newEvent`, `eventFiles`, `precheck(read, files, replace, reread)` (which returns the added findings; the tool decides what refuses), `chooseTemplate`, `checkText` and `checkReason`. `applyPlan(log, plan, { trailerKeys, tool, noun, scope?, rerenderAfterEdit: "always" | "when-events-change", afterEditBytes: "plan" | "worktree", compose, message, afterStage, index })`, with `compose` allowed to return a promise and `afterStage` given the scope. adr passes `"when-events-change"` and `"plan"`, issues `"always"` and `"worktree"`; `afterEditBytes` decides the bytes of both `compose`'s tree and the step-4 tree. A `runWrite` driver that takes the tool's read, plan and document builders, and `editorStep`. All of this goes in `packages/ledger/src/surfaces/` (new `write-plan.ts`, `apply-plan.ts` and `write-driver.ts`), because `applyPlan` commits through `commitWithRecovery` and the driver resolves the actor there. `stagedEventRefs(layout, paths)` (15 lines, `adr/src/write.ts:1832`, `issues/src/apply.ts:438`) goes in `surfaces/commit-message.ts`, next to the `EventRef` type it returns. Candidate 6 needs it too, so whichever of 5 and 6 lands first moves it and the other uses it.
    - **Risk.** High. This is the largest piece and runs under the same index invariant. The safety net must pass unchanged: in adr, `src/write.model.test.ts`, `src/write.test.ts`, `src/write.copy-scope-operation.test.ts`, `src/cli/write.test.ts` and `src/cli/index-invariant.*.test.ts`; in issues, `src/plan.model.test.ts`, `src/plan.test.ts`, `src/write.test.ts`, `src/write.index.*.test.ts`, `src/cli/commit-staged.test.ts` and `src/cli/index-invariant.test.ts`. Moving `applyPlan` and the driver separately keeps each commit reviewable.
    - **Size.** 6–8 commits: plan helpers; `applyPlan`; driver and editor step; then each tool, one part at a time.
    - **Recommendation.** Lift now, after candidate 3, whose index helpers `applyPlan` calls.

    ### 6. Init, git hook steps, CLI editor

    - **Files.** `initDecisionLog` and `initIssueLog` (`packages/adr/src/init.ts:105`, `packages/issues/src/init.ts:114`) with `appendLine`, `namesSkill` and `agentsPointer`. `packages/adr/src/hooks.ts` and `packages/issues/src/hooks.ts`: `{decision,issue}HookCommands`, `registrations`, `shown`, `inHookOrder`, `result`, install, uninstall and print, `stagingSafe`, `runPreCommitHook` (adr 192, issues 250), and the shared part of `addHookTrailers` (adr 139, issues 164). Both tools' `cli/hooks.ts`. `packages/adr/src/cli/editor.ts` and its copy `packages/issues/src/cli/editor.ts`, whose header already names it a step 5 candidate.
    - **Same.** Init's config placement (repo root or log root, the note for a repo file that names another log), the templates kept or written, the skill and AGENTS.md pointer steps with their rollback, and the commit. The pre-commit hook's three steps (rename following, index, `verify --staged`). Hook registration through ledger's shims. In `commit-msg`: skip when an event trailer exists or during a merge, then append the staged event trailers. The editor differs in one message.
    - **Differs.** Domain: starter config text, built-in templates, the skill text, and issues' `commit-msg` extras ("fixes ?N", the current-issue notes). Accidental:
      - Init's index step. adr renders the tree the commit will hold and refreshes the work tree after the commit (`packages/adr/src/init.ts:225, 289-306`). issues renders the work tree (`log.tree`) even when it commits, commits only init's files, and doesn't refresh (`packages/issues/src/init.ts:172-191, 304-317`). Reading the code, a committing `issues init` that writes a missing `index.md` while other issue files are uncommitted commits an index listing them, which is `index/stale` at that commit, the state ADR-0010 exists to prevent. This is a bug, not a lift, so it gets its own issue ("Commit the index of the tree issues init commits"), which can start now and touches only `packages/issues/src/init.ts` and its test. The lift waits for it, so the lift itself changes no behavior.
      - issues removes an empty `<root>/.gitkeep` placeholder once the log has files (?8), and adr doesn't. The shared init takes this as an option that only issues turns on, so adr's behavior doesn't change.
      - issues filters `worktree.notes` out of the rename notes, while adr dedupes them with a `Set`.
      - The editor's failure message: adr adds "; the draft is staged as rendered".
      - issues' `addHookTrailers` runs inside `withGitOperation` (`packages/issues/src/hooks.ts:165`) and adr's doesn't (`packages/adr/src/hooks.ts:139-166`); the shared step runs inside it. `withGitOperation` only groups the git calls into one operation, so no output changes.
    - **Proposed API.** In `packages/ledger/src/surfaces/`, exported from the root entry: `initToolLog(log, { tool, configName, starterConfig, builtins, defaultTemplates, skill, index, commitTitles, removePlaceholder })`, `runPreCommitHook({ worktree, index, env, followRenames, renderIndex, verify, tool })` and `stagedEventTrailers(git, layout, keys): Promise<{ refs: EventRef[]; trailers: Trailer[] }>`, which returns the refs too because issues' `commit-msg` builds its "fixes ?N" set from them (`closing`, `packages/issues/src/hooks.ts:204`). They go in `surfaces/` and not `hooks/`, because they take a `ToolLog` and call `resolveAttribution` (`surfaces/actor.ts`). `stagedEventTrailers` builds on `stagedEventRefs` in `surfaces/commit-message.ts`, which candidate 5 also needs: whichever of 5 and 6 lands first moves it there, and `stagedEventTrailers` defines no copy. `addHookTrailers` (`adr/src/hooks.ts:139-170`) today takes the paths in `git diff --cached` order without deduping and doesn't filter `.yaml`; `stagedEventRefs` sorts, filters and dedupes, and `eventTrailers` already dedupes by subject and type, so for ASCII paths the trailers don't change. In `packages/ledger/src/hooks/`: `hookRegistrations`, next to `install.ts`. In `packages/ledger/src/cli/`, exported from `ledger/cli`: `editorFromEnv` and a `hooksCommand`. The two `cli/hooks.ts` files differ in names and option help (issues gives `--manager` a `value` and `help`, `issues/src/cli/hooks.ts:39-45`; adr doesn't), so option help is a parameter of `hooksCommand` and each tool's `--help` stays as it is. adr's editor message becomes a parameter.
    - **Risk.** Medium for init, low for the hooks.
    - **Size.** 4 commits.
    - **Recommendation.** Lift now, after candidates 2 (the hook keys) and 3 (index render), and after the init index bug is fixed. It doesn't wait for candidate 5: it only shares `stagedEventRefs` with it, and whichever lands first moves that. The tests that must pass unchanged are adr's `src/init.test.ts`, `src/hooks.test.ts`, `src/cli/init.test.ts`, `src/cli/hooks.test.ts` and `src/cli/editor.test.ts`, and issues' `src/init.test.ts`, `src/hooks.test.ts`, `src/cli/init.test.ts` and `src/cli/editor.test.ts`.

    ### 7. `for` path lookup and template listing

    - **Files.** `decisionsFor` and `repoPath` (`packages/adr/src/scope.ts:107, 89`), `issuesFor` and `repoPath` (`packages/issues/src/scope.ts:83, 64`), and `listTemplates` in both tools' `templates/list.ts`.
    - **Same.** The path checks (length, outside the repository, directory by `lstat` or index listing, with the same messages), tracked detection, `scanAnchors` and `scopeLookup`, unresolved anchors, and the findings filter. `listTemplates` is the same apart from kind and format name.
    - **Differs.** Domain: which subjects apply (adr: decisions ever in force; issues: globs of open and in-progress issues, and anchors of those or, with `--all`, of every issue), the order, and the per-path fields (`status` and `effective`, or `state`, `canonical` and `blocked`).
    - **Proposed API.** In `packages/ledger/src/scope/`: `lookupPaths(git, { tool, tree, ref, commit, cwd, paths, keyword, exclude, excludeDirs, globSubjects, known })`, which returns per path `{ path, tracked, matches, unresolved }`. It takes two subject inputs because the tools match globs against a filtered list (`GLOBS_APPLY` in adr, `ACTIVE` in issues) but resolve anchors against every view: `globSubjects: { id, globs }[]` goes to `scopeLookup`, and an anchor match goes to `unresolved` when it names another log (`other-log`) or `!known(id)` (`not-found`), as `views.get(m.id) === undefined` decides now. Each tool then filters what is left (issues' `shown`, for `--all`), orders it and maps it. In `packages/ledger/src/templates/`: `listKindTemplates(tree, root, { requireSections, builtins })`. It takes the kind's required section ids rather than the kind, because `templates/` sits below `kind/`. Each tool passes `kind.def.templates?.requireSections ?? []`, as its `lint` does now.
    - **Risk.** Low.
    - **Size.** 2–3 commits.
    - **Recommendation.** Lift now.

    ### 8. Relations

    Two parts, with different recommendations.

    **8a. Qualified-reference checks: lift later.**
    - **Files.** adr `relate`, inner `foreign` and `missing` (`packages/adr/src/kind/rules.ts:64-109`), and `planLink`'s qualified target (`packages/adr/src/write.ts:1153-1179`). issues `relate`'s local and qualified branches (`packages/issues/src/kind/rules.ts:171-259`) and `resolveTarget` (`packages/issues/src/log.ts:400`). The foreign source shapes `AdrSource`/`ForeignDecision` and `SourceLog`/`ForeignSubject`.
    - **Same.** Splitting `<source>:<id>` at the first `:` by hand. ledger's `parseQualifiedId` exists, but neither tool uses it. Then an unknown source, a source that isn't cached (not checked), and an id the cached source doesn't hold. The link-planning message `unknown source X; add a [[sources]] entry named X` is identical in both tools.
    - **Differs.** Domain: rule ids and messages, issues' target-kind rule (`implements` needs a decision) and `implements-unaccepted`. Accidental:
      - issues counts a local target that exists but has no folded state as missing, while adr counts it as present. `ForeignDecision` has no `effective`.
      - The link planners check in different orders. adr's `planLink` refuses a bad source name or a bad id part first (`invalid decision "<input>"`, `write.ts:1157-1159`), then an unknown source, then the kind. issues' `resolveTarget` checks the kind and the unknown source first, and a bad id part last (`use the id in X; numbers in other logs need their history`, `log.ts:417, 435`, pinned by `issues/src/log.test.ts:134`). So `unknown:12` is `invalid decision` in adr and `unknown source unknown` in issues.
    - **Proposed API, for when it is lifted.** In `packages/ledger/src/sources/`, generic over each tool's own source shape, so adr's `AdrSource` and issues' `SourceLog` stay as they are and no exported type changes:
      ```ts
      interface SourceEntry<V> { readonly subjects: ReadonlyMap<string, V> | null }
      type Qualified = { readonly source: string; readonly id: string; readonly idValid: boolean };
      type ReferenceCheck<V, T extends SourceEntry<V>> =
        | { readonly result: "local-missing" }
        | { readonly result: "local-unfolded" }
        | { readonly result: "found-local" }
        | ({ readonly result: "malformed-source" } & Qualified)
        | ({ readonly result: "unknown-source" } & Qualified)
        | ({ readonly result: "unchecked"; readonly log: T | null } & Qualified)
        | ({ readonly result: "not-in-source"; readonly log: T } & Qualified)
        | ({ readonly result: "found"; readonly log: T; readonly subject: V } & Qualified);
      checkReference<V, T extends SourceEntry<V>>(ref: string, {
        local: { has(id: string): boolean; folded(id: string): boolean },
        sources: ReadonlyMap<string, T> | null,
      }): ReferenceCheck<V, T>
      ```
      Order: a reference containing `:` is split at the first `:`, as both tools do now. If `sources === null`, the result is `unchecked` with a `null` log, before any check of the source name, because both `relate`s return before splitting when sources aren't loaded (adr `rules.ts:70`, issues `rules.ts:197`) and `null` is adr's default for reads. Otherwise, a source part that `isSourceName` (?12) rejects gives `malformed-source`; a name not in `sources` gives `unknown-source`; an uncached source gives `unchecked` with its log; then `found` or `not-in-source`. Every qualified result carries `idValid` (`isSubjectId` of the id part, from `identity/`, layer 2) instead of a fixed place in the order, because the two link planners check the id at different points: `planLink` maps `malformed-source` or `idValid === false` to `invalid decision …` before anything else, and `resolveTarget` checks the kind and `unknown-source` first and maps `idValid === false` to `use the id in …` last. `resolveTarget` never reads `subjects`, so it accepts `unchecked`, `not-in-source` and `found` alike after its checks, and refuses a `local: true` source under `implements` as `unknown source …`. `planLink`'s kind check reads the kind from `o.kinds`, so the entries adr builds carry it from there. Both `relate`s map `malformed-source` to their unknown-source rule, so when sources are loaded, adr's `decision/unknown-source` for a stored reference whose source name is longer than 32 characters (allowed by `REF`) doesn't change, and when they aren't, that reference is still skipped. issues still checks `log.kind` for `issue/target-kind` before skipping or reporting, in today's order, and reads `status` and `effective` from `found`'s subject for `issue/implements-unaccepted`. adr counts `local-unfolded` as present and issues as missing, so that accidental difference stays as it is.
    - **Existing ledger helpers.** `parseQualifiedId` (`sources/qualified-id.ts`) parses strictly, with the 32-character cap and an 8-character id, and returns `null` for anything else, so it can't classify the long source names adr's `REF` accepts or the bad id parts both planners report. `resolveQualifiedId` (`sources/resolve.ts`) checks a reference asynchronously against raw trees (an events directory or body file exists) and returns `malformed`, `unknown-source`, `not-found` or `ok`; both tools' `relate` works on folded subject maps and needs the uncached and unfolded cases. Neither tool calls either. Both are root exports, so they stay. With `checkReference`, ledger would have three readers of `<source>:<id>`, and its README must say which to use when; whether `resolveQualifiedId` can be rebuilt on `checkReference` is for the lift to decide.
    - **Risk.** Low. The messages are pinned by `kind/rules.test.ts` in both tools and by `issues/src/log.test.ts`.
    - **Size.** 3 commits.
    - **Depends on.** ?12 (`isSourceName`) only. The tools already build the subject maps (`adr/src/sources.ts:67`, `issues/src/sources.ts:186`), so it doesn't need candidate 4. Candidate 4 edits other functions of the same files; whichever lands second rebases.
    - **Recommendation.** Lift later, with the next change to either tool's `relate`, `planLink` or `resolveTarget`, or when a third kind reads qualified references. What a lift buys is one place that decides unknown, uncached and missing, so the tools can't drift on them. But the shared logic is about 10 lines per call site (split, `null` check, lookup, `has`), and because the call sites check in different orders, each of the four would map an eight-variant result plus `idValid` back to its own messages, which is about as long as what it replaces. That is the reasoning that leaves 8b in the tools, and nothing has drifted yet. It gets its own issue now, so the trigger is tracked.

    **8b. Supersession chain and issue graph: leave in the tools.**
    - **Files.** adr `chainOf` and the `supersedes` inverse (`packages/adr/src/kind/project.ts:58, 77`), and the supersession-cycle walk (`packages/adr/src/kind/rules.ts:141-167`). issues `packages/issues/src/kind/graph.ts`: Tarjan `components` (79), `shortestCycle` (120), `cyclesOf` (153), `canonicalOf` (198), `build` (188) and the per-log cache `issueGraph` (319).
    - **Same.** Following one pointer with a visited list, ending in `null` on a cycle (`chainOf` and `canonicalOf`, about 10 lines each). Reporting a cycle once, on its smallest id. Deriving sorted inverse lists.
    - **Differs.** Mostly domain. adr's chain follows `superseded_by`, which only an applied `superseded` transition sets. adr has no other relation with meaning: `linked` with `depends-on` has no rules. issues has two many-to-many graphs, with effective edges through duplicates, strongly connected components and shortest cycle paths, plus `ready` and `blocked`. Only issues uses each of these. Accidental: adr's chain ends on a referenced id that isn't folded (so `effective` can name an unfolded subject), while issues stops at the last folded issue. adr computes `supersedes` by scanning every subject for each view, which is quadratic over a listing, while issues builds its graph once per log.
    - **Proposed API.** None now. A pointer-following helper would be 10 lines with a flag for the unfolded-end difference, and making the two agree would change adr's `effective` and `chain` output. A declared relation layer (types, direction, acyclicity), as `docs/00-ark-v1.md` sketches it, would have one user per relation shape.
    - **Risk and size.** None, not lifted.
    - **Recommendation.** Leave in the tools. Revisit when a third kind needs a relation graph, or when an adr relation other than supersession gets rules. ADR-0002 already allows this: layers that encode domain behavior move into ledger only once both tools use them and their shapes match, and these shapes don't match.

    ### 9. Agent surfaces, after issues 3a to 3d

    Text folding, search terms and excerpts moved to ledger in issues 3a (fe1f412), and serving goes through ledger's `serveMcp`. What is still copied:

    - **Search ranking** (`searchDecisions`, `packages/adr/src/search.ts:94`; `searchIssues`, `packages/issues/src/search.ts:91`). The scoring loop (10 / 5 / up to 3 / up to 2) and the excerpt choice are the same. The fields (notes or comments, issues' bare number), the active set and the order are domain. fe1f412 decided that ranking stays with each tool. Proposed API: none. Risk and size: none, not lifted. **Leave in the tools.**
    - **MCP schema and argument helpers** (`ID`, `TEXT`, `SECTIONS`, `GLOBS`, `SOURCE`, `object`, `READ`, `WRITE`, `str`, `strings`, `doc`: `packages/adr/src/mcp/tools.ts:55-94`, `packages/issues/src/mcp/tools.ts:13-87`), and the resource template's id-length guard with not-found handling (`packages/adr/src/mcp/resources.ts:44`, `packages/issues/src/mcp/resources.ts:64`). Verbatim, about 50 lines. ?12 already makes both `SOURCE` schemas use the shared pattern, so this lift only moves the constant. Proposed API: the same constants and readers, exported from `packages/ledger/src/mcp/` (the `ledger/mcp` entry, the only layer that may import the MCP SDK), and `checkResourceId(id, noun)`, the id-length guard that throws `invalid <noun> "…": an id or number is at most MAX_ID characters`, with the not-found handling beside it. **Lift later**, with the next change to either MCP server: about 1–2 commits, low risk, and no drift so far. It gets its own issue now, so the trigger is tracked.
    - **Server setup, policy, prompts, skill text, CLI and MCP text renderers.** The wording and the tool lists are each tool's own. Proposed API: none. Risk and size: none, not lifted. **Leave in the tools.**

    ### 10. Test support

    `packages/adr/src/test-support/` and `packages/issues/src/test-support/` both hold an `index-invariant.ts` and a `cli.ts`. They describe each tool's commands and are the acceptance net for lifts 3, 5 and 6, so they must stay unchanged while those lifts run. Proposed API: none. Risk and size: none, not lifted. **Leave in the tools.**

