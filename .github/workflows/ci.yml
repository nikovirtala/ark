name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the packages to test; each one gets its own `test (<package>)` job, so the tests take
  # as long as the slowest package rather than the sum of all of them.
  select:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch must be present for the changed-packages filter.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # `pnpm ls` reads the workspace manifests, so no install is needed.
      - name: Select packages to test
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # pnpm -r leaves out the workspace root; the root depends on adr for its git hooks, so
          # "..." selects it, and its test script is the whole suite; exclude it.
          if [ "$EVENT" != pull_request ]; then
            echo "push to ${GITHUB_REF_NAME}: testing every package" | tee -a "$GITHUB_STEP_SUMMARY"
            filter=(-r --filter '!ark')
          else
            base="origin/$BASE_REF"
            # pnpm's changed filter ignores workspace-level files that affect every package.
            if git diff --name-only "$base"...HEAD | grep -qvE '^(packages/|docs/|\.changeset/|[^/]+\.md$)'; then
              echo "workspace-level files changed: testing every package" | tee -a "$GITHUB_STEP_SUMMARY"
              filter=(-r --filter '!ark')
            else
              echo "testing packages changed since $base and their dependents" | tee -a "$GITHUB_STEP_SUMMARY"
              filter=(--filter "...{./packages/**}[$base]" --filter '!ark')
            fi
          fi
          packages=$(pnpm "${filter[@]}" ls --depth -1 --json |
            node -e 'const ps = JSON.parse(require("fs").readFileSync(0, "utf8"));
              console.log(JSON.stringify(ps.map((p) => require("path").basename(p.path)).sort()))')
          echo "packages: $packages" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "packages=$packages" >>"$GITHUB_OUTPUT"

  verify:
    name: lint, build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch must be present for verify --base and commitlint.
          fetch-depth: 0
          persist-credentials: false
      # pnpm comes from "packageManager" in package.json; Node is the major pinned in mise.toml.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # tsc -b (declarations and test typecheck) and tsdown bundles for the whole workspace:
      # dependents need their dependencies built.
      - run: pnpm build
      # R9: the shared init reproduces ark's committed agent setup with no diff (docs/03-setup-v1.md).
      - name: Verify ark's agent setup (R9)
        run: node scripts/check-agent-setup.mjs
      # doctor as a warning (design "doctor", Q3): it reports gaps in ark's agent setup but never
      # fails the build. It runs the workspace build because ark's pinned published tools don't
      # have doctor yet (ADR-0017; the pins bump in a later release). doctor exits 1 on a missing
      # piece (R5), so `|| true` keeps the step green and the output is the warning.
      - name: Report ark's agent setup (doctor, warning)
        run: |
          echo "## doctor (warning)" >>"$GITHUB_STEP_SUMMARY"
          { node packages/adr/dist/cli.js doctor && node packages/issues/dist/cli.js doctor; } \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
      # ark has no [[sources]] in docs/adr/adr.toml or docs/issues/issues.toml, so neither verify
      # step passes --fetch-sources (it would fetch nothing). Add it to both when ark gets a source.
      - name: Verify ark's decision log
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node packages/adr/dist/cli.js verify --base "origin/$BASE_REF" --format github
          else
            node packages/adr/dist/cli.js verify --format github
          fi
      # The workspace build, like adr's step: it checks the log with the issues code at this commit.
      - name: Verify ark's issue log
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node packages/issues/dist/cli.js verify --base "origin/$BASE_REF" --format github
          else
            node packages/issues/dist/cli.js verify --format github
          fi
      # The commit checks run last and even after a failed step, so a push with fixup! commits
      # still gets lint, build and verify results (AGENTS.md: CI covers the tip of each push).
      - name: Lint commit messages
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Only this PR's commits: main's history (including commits from before commitlint) is never linted.
        run: pnpm exec commitlint --from "origin/$BASE_REF" --to "$HEAD_SHA" --verbose
      - name: Reject fixup commits
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-fixups.sh "origin/$BASE_REF" "$HEAD_SHA"

  test:
    # No name: GitHub calls each matrix job `test (<package>)` after the job id and the package,
    # and the job skipped when no package needs testing plain `test`. A name built from the matrix
    # showed its expression unfilled there, because a skipped job's matrix never expands.
    needs: select
    # An empty matrix is an error, and no package changed means there is nothing to test.
    if: needs.select.outputs.packages != '[]'
    # The 4-core arm runner with 6 vitest workers ran the issues tests about 20% faster than
    # ubuntu-latest with the default 3 (issue 5z5rsn65). Six workers on 4 cores pay off because the
    # tests also wait on the git and node processes they spawn.
    runs-on: ubuntu-24.04-arm
    strategy:
      # Every package's result is worth having, as with `pnpm -r run test`, which runs them all.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CLI and e2e tests spawn the built binaries, and dependents import dependencies' dist/.
      - run: pnpm build
      - name: Test ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: pnpm --filter "./packages/$PACKAGE" run test --maxWorkers=6

  # The one status to require in branch protection: it keeps the name of the single job CI used
  # to have, and fails unless every job above passed (or, with nothing to test, was skipped).
  check:
    if: ${{ always() }}
    needs: [select, verify, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          SELECT: ${{ needs.select.result }}
          VERIFY: ${{ needs.verify.result }}
          TEST: ${{ needs.test.result }}
          PACKAGES: ${{ needs.select.outputs.packages }}
        run: |
          echo "select: $SELECT, verify: $VERIFY, test: $TEST (packages: ${PACKAGES:-none})"
          [ "$SELECT" = success ] && [ "$VERIFY" = success ] || exit 1
          [ "$TEST" = success ] || { [ "$TEST" = skipped ] && [ "$PACKAGES" = '[]' ]; }
